<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <header>
    <h1 id="title"></h1>
    <div id="session" hidden>
      <span id="who"></span>
      <span id="usage"></span>
      <button id="logout"></button>
    </div>
  </header>

  <p id="status" role="status"></p>

  <main>
    <section id="auth">
      <h2 id="authTitle"></h2>
      <form id="authForm">
        <label><span id="emailLabel"></span><input id="email" type="email" required autocomplete="username"></label>
        <label><span id="passwordLabel"></span><input id="password" type="password" required autocomplete="current-password"></label>
        <div class="row">
          <button id="login" type="submit"></button>
          <button id="register" type="button" class="secondary"></button>
        </div>
      </form>
      <p id="privacy" class="muted"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="messages.js"></script>
  <script src="app.js"></script>
</body>
</html>
